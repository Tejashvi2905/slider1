<!DOCTYPE html>
<html>
<head>
    <title>Image Slider</title>
</head>

<body>

    <h2>Image Slider</h2>

    <img id="slider" src="bouquet-11.jpg" width="500" height="500" img alt="Image Slider">

    <br><br>

    <button onclick="previous()">Previous</button>
    <button onclick="next()">Next</button>

    <script>

        var images = ["bouquet-11.jpg", "bouquet-12.jpg", "bouquet-13.jpg"];
        var i = 0;

        function next() {
            i = i + 1;

            if (i >= images.length) {
                i = 0;
            }

            document.getElementById("slider").src = images[i];
        }

        function previous() {
            i = i - 1;

            if (i < 0) {
                i = images.length - 1;
            }

            document.getElementById("slider").src = images[i];
        }

    </script>

</body>
</html>
